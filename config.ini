[Probe]
; Passive phase: logs temporal shaders and their bound D3D11 resources.
; Original TAA draws are never skipped in this build.
MaxTaaDrawLogs=0

[DLAA]
; The bridge evaluates DLAA only after the original TAA command list completes.
Enable=1
; 1 keeps the original game output visible while validating NGX and its inputs.
EvaluateOnly=1
; F8 toggles Game TAA/DLAA only while the game owns the foreground window.
; Startup remains EvaluateOnly; any bridge error automatically falls back to original TAA.
AllowPresentationToggle=1
PresentationToggleKey=119
; Audited Odyssey build uses conventional device depth. Production GPU readback is disabled.
DepthInverted=0

[DLSSNR]
; F9 opens the persistent control panel. Neural Rendering is deliberately off
; until enabled there. F8 still selects Game TAA versus the DLAA/NR route.
Enable=0
Preset=0
Style=0
Intensity=1.0
LocalToneStrength=1.0
LocalStructureStrength=1.0
SkinStructureStrength=-1.0
UseAutoMask=1
UICorrection=1

[DLSSNR.Advanced]
; 0 uses the audited game flag, 1 forces normal, 2 forces inverted.
DepthConvention=0
MotionScaleX=1.0
MotionScaleY=1.0
; Odyssey's known input is LDR UNORM, so identity color transfer is the safe default.
ControlCompatibleColorTransfer=0
ScenePaperWhiteScale=1.0
HDRTransferStrength=1.0
ColorStrength=1.0

[DLSSNR.UI]
ShowAdvanced=0
