[Probe]
; Number of detailed TAA draw records. 0 disables them.
MaxTaaDrawLogs=0

[DLAA]
; Set to 0 to leave only the original Game TAA active.
Enable=1
; 1 starts with Game TAA visible; 0 starts with DLAA visible.
EvaluateOnly=1
; Enables the foreground-only Game TAA/DLAA toggle.
AllowPresentationToggle=1
; Decimal Win32 virtual-key code. 119 is F8.
PresentationToggleKey=119
; Validated depth convention. Leave this at 0.
DepthInverted=0
